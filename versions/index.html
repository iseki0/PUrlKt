<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PUrlKt Docs</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f3efe6;
      --surface: #fffaf0;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #d6cfc2;
      --accent: #0f766e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Georgia", "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(15,118,110,0.12), transparent 28rem),
        linear-gradient(180deg, #f7f3ea 0%, var(--bg) 100%);
      color: var(--ink);
    }
    main {
      max-width: 58rem;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }
    p {
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.65;
      max-width: 42rem;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr));
      gap: 1rem;
      margin: 2rem 0 2.5rem;
    }
    .card {
      display: block;
      padding: 1.25rem;
      border: 1px solid var(--line);
      border-radius: 1rem;
      background: rgba(255, 250, 240, 0.86);
      text-decoration: none;
      color: inherit;
      box-shadow: 0 18px 45px rgba(31, 41, 55, 0.08);
      backdrop-filter: blur(8px);
    }
    .card span {
      display: block;
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 0.4rem;
    }
    .card strong {
      font-size: 1.15rem;
    }
    .card.disabled {
      opacity: 0.62;
      pointer-events: none;
    }
    h2 {
      margin-top: 3rem;
      font-size: 1.25rem;
    }
    ul {
      padding-left: 1.2rem;
    }
    li + li {
      margin-top: 0.5rem;
    }
    a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>PUrlKt Docs</h1>
    <p>
      Stable API docs are published for tagged releases. A continuously updated snapshot
      is kept separately so master can still be inspected without replacing the stable site.
    </p>
    <section class="cards">
      <a class="card" href="../releases/0.0.9/"><span>Latest release</span><strong>0.0.9</strong></a>
      <a class="card" href="../snapshot/"><span>Snapshot</span><strong>master-SNAPSHOT</strong></a>
    </section>
    <section>
      <h2>Published releases</h2>
      <ul>
        <li><a href="../releases/0.0.9/">0.0.9</a></li>
      </ul>
    </section>
  </main>
</body>
</html>
